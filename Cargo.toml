[package]
name = "unbound-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Independent AR glasses USB, HID, serial and TCP protocols"
authors = ["MarkPronkin <109197080+MarkPronkin@users.noreply.github.com>"]
repository = "https://github.com/MarkPronkin/unbound-protocol"
readme = "README.md"
include = ["/src/**/*.rs", "/examples/**/*.rs", "/tests/**/*.rs", "/tests/fixtures/*.bin", "/tools/*.py", "/docs/**", "/assets/**", "/licenses/LGPL-2.1.txt", "/licenses/ar-drivers-rs-MIT.txt", "/licenses/xr-tools-MIT.txt", "/build.rs", "/LICENSE", "/NOTICE", "/README.md", "/Cargo.toml", "/Cargo.lock"]

[features]
default = []
hid = ["dep:hidapi"]
libusb = ["dep:rusb"]
serial = ["dep:serialport"]

[dependencies]
socket2 = "0.6"
hidapi = { version = "2.6", optional = true, default-features = false, features = ["linux-native-basic-udev"] }
rusb = { version = "0.9.4", optional = true }
serialport = { version = "4.8", optional = true, default-features = false }

[[bin]]
name = "unbound-protocol"
path = "src/bin/unbound-protocol.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
